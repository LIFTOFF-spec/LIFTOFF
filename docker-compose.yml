# Layanan lokal untuk development. Jalankan: pnpm db:up
services:
  postgres:
    image: postgres:17-alpine
    container_name: liftoff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: liftoff
      POSTGRES_PASSWORD: liftoff
      POSTGRES_DB: liftoff
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftoff -d liftoff"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: liftoff-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
